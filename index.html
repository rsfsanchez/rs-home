<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="R Sanchez — Computer Science."
  >
  <title>R Sanchez | Computer Science</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-content">
      <nav aria-label="Primary navigation">
        <ul class="site-nav">
          <li><a href="#home">Home</a></li>
          <li><a href="#mission">Mission</a></li>
          <li><a href="#projects">Projects</a></li>
          <li><a href="#skills">Skills &amp; Tools</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main-content">
    <section class="hero" id="home" aria-labelledby="hero-heading">
      <div class="container hero-content">
        <div class="profile-avatar" role="img" aria-label="Stylized Arizona state flag profile graphic"></div>
        <h1 id="hero-heading">R Sanchez</h1>
        <p class="hero-role">Computer Science</p>
      </div>
    </section>

    <section class="section" id="mission" aria-labelledby="mission-heading">
      <div class="container section-content">
        <h2 id="mission-heading">Mission</h2>
        <p>Push code and AI as far as they’ll go, then see what breaks.</p>
      </div>
    </section>

    <section class="section" id="projects" aria-labelledby="projects-heading">
      <div class="container section-content">
        <h2 id="projects-heading">Projects</h2>
        <div class="projects-row">
          <a class="project-entry" href="https://rsfsanchez.github.io/pet-quest/" target="_blank" rel="noopener noreferrer">
            <span class="project-paw" aria-hidden="true">🐾</span>
            <span class="project-title">Pet Quest</span>
          </a>
          <p class="loading" aria-label="More projects are still being built">
            Loading<span class="loading-dots" aria-hidden="true"><span class="loading-dot">.</span><span class="loading-dot">.</span><span class="loading-dot">.</span></span>
          </p>
        </div>
      </div>
    </section>

    <section class="section" id="skills" aria-labelledby="skills-heading">
      <div class="container section-content">
        <h2 id="skills-heading">Skills &amp; Tools</h2>
        <ul class="skills-grid" aria-label="Skills and tools">
          <li>Claude</li>
          <li>Codex</li>
          <li>Godot</li>
          <li>Unreal Engine</li>
          <li>C++</li>
          <li>Java</li>
        </ul>
        <p class="forging-status" aria-label="Forging...">
          Forging<span class="forging-dots" aria-hidden="true"><span class="forging-dot">.</span><span class="forging-dot">.</span><span class="forging-dot">.</span></span>
        </p>
      </div>
    </section>
  </main>

</body>
</html>
